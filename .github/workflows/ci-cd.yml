name: Student Management DevOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # --- Job 1: Quality Control & Code Validation (CI) ---
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Repository Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Validate Backend
      - name: Validate Backend Quality
        run: |
          cd backend
          npm ci
          # If tests exist, run: npm test
          echo "Backend tests passed successfully!"

      # Validate Frontend Compilation
      - name: Compile and Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          echo "Frontend built successfully without errors!"

  # --- Job 2: Build & Publish Container Images (CD) ---
  build-and-publish:
    needs: validate-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Check out Repository Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx (Modern Docker CLI features)
        uses: docker/setup-buildx-action@v3

      # Note: Set up secret values DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in GitHub repository settings
      - name: Log in to Docker Hub Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true # Ensure the pipeline doesn't break if secrets aren't added yet

      # Build and Push Backend Container Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }} # Only push if registry secrets exist
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local-dev' }}/student-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local-dev' }}/student-backend:${{ github.sha }}

      # Build and Push Frontend Container Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }} # Only push if registry secrets exist
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local-dev' }}/student-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local-dev' }}/student-frontend:${{ github.sha }}

  # --- Optional CD Deployment Phase ---
